<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Gerard Castell — Software and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7f5e"/>
      <stop offset="100%" stop-color="#ff4f36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff4f36" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff4f36" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1010" cy="150" r="240" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="24" fill="none" stroke="#000000" stroke-opacity="0.10" stroke-width="1"/>

  <!-- neural / agent graph motif -->
  <g stroke="#ff4f36" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M905 160 L1000 95 M905 160 L1000 160 M905 160 L1000 225 M1000 95 L1095 128 M1000 160 L1095 128 M1000 160 L1095 192 M1000 225 L1095 192"/>
  </g>
  <g fill="#ff4f36">
    <circle cx="905" cy="160" r="7"/>
    <circle cx="1000" cy="95" r="5" fill-opacity="0.8"/>
    <circle cx="1000" cy="160" r="5" fill-opacity="0.8"/>
    <circle cx="1000" cy="225" r="5" fill-opacity="0.8"/>
    <circle cx="1095" cy="128" r="4" fill-opacity="0.55"/>
    <circle cx="1095" cy="192" r="4" fill-opacity="0.55"/>
  </g>

  <g font-family="Segoe UI, SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="120" fill="#171717" font-size="60" font-weight="700" letter-spacing="-1.5">Gerard Castell</text>
    <text x="80" y="163" fill="url(#flame)" font-size="21" font-weight="600" letter-spacing="4.5">SOFTWARE &amp; AI ENGINEER</text>
    <rect x="80" y="192" width="72" height="3" rx="1.5" fill="#ff4f36"/>
    <text x="80" y="240" fill="#525252" font-size="19" font-weight="400">Taking AI from prototype to production — agents, multimodal</text>
    <text x="80" y="268" fill="#525252" font-size="19" font-weight="400">models and the systems that keep them honest.</text>
  </g>
</svg>
